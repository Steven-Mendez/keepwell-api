# Deploys one environment, strictly in this order:
#   1. terraform apply   infrastructure only; Lambda code is not Terraform's after creation
#   2. migrate           schema forward (additive), before any code that needs it
#   3. deploy code       the zip built once in `check` becomes a version; `live` moves to it
#   4. verify            smoke test
# A failure stops the chain: the live alias still points at the previous version.
name: deploy

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true

permissions:
  contents: read
  id-token: write

# One deploy per environment at a time, never cancelled: an interrupted apply or migration is
# worse than a queued one.
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"
  TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
  TF_VAR_domain: ${{ vars.DOMAIN }}
  TF_VAR_web_origin: ${{ vars.WEB_ORIGIN }}

jobs:
  deploy:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lambda
          path: dist
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: 1. terraform apply
        working-directory: infra/envs/${{ inputs.environment }}
        run: |
          terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          terraform apply -auto-approve

      - name: outputs
        id: out
        working-directory: infra/envs/${{ inputs.environment }}
        run: |
          {
            echo "url=$(terraform output -raw api_url)"
            echo "db=$(terraform output -raw db_endpoint)"
            echo "app_role=$(terraform output -raw app_role_arn)"
            echo "jobs_role=$(terraform output -raw jobs_role_arn)"
            echo "api_fn=$(terraform output -raw api_function)"
            echo "jobs_fn=$(terraform output -raw jobs_function)"
            echo "notifications_role=$(terraform output -raw notifications_role_arn)"
            echo "notifications_fn=$(terraform output -raw notifications_function)"
          } >> "$GITHUB_OUTPUT"

      - name: 2. migrate
        env:
          DB_HOST: ${{ steps.out.outputs.db }}
          APP_IAM_ROLE_ARN: ${{ steps.out.outputs.app_role }}
          JOBS_IAM_ROLE_ARN: ${{ steps.out.outputs.jobs_role }}
          NOTIFICATIONS_IAM_ROLE_ARN: ${{ steps.out.outputs.notifications_role }}
        run: pnpm db:migrate

      - name: 3. deploy code
        run: scripts/deploy-code.sh "${{ steps.out.outputs.api_fn }}" "${{ steps.out.outputs.jobs_fn }}" "${{ steps.out.outputs.notifications_fn }}"

      - name: 4. smoke test
        run: ./scripts/smoke.sh "${{ steps.out.outputs.url }}" "${{ github.sha }}"
